[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pondie-astra"
version = "0.1.0"
description = "The astra-distill models' paper prompt and compact record format, and the schema they were trained on"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# `prompt.ntok` counts tokens with NuExtract3's tokenizer, as the shards' 46k cut did.
tokens = ["transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pondie_astra = ["extraction-record.schema.json"]
